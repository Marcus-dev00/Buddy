<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Buddy</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      /* Top-right language toggle */
      .lang-btn {
        position: fixed;
        top: max(20px, env(safe-area-inset-top));
        right: max(20px, env(safe-area-inset-right));
        z-index: 20;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.78);
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.02em;
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }

      .lang-btn:hover {
        background: rgba(255, 255, 255, 0.13);
        border-color: rgba(255, 255, 255, 0.28);
        color: #ffffff;
        transform: translateY(-1px);
      }

      .lang-btn:active {
        transform: scale(0.96);
      }

      .lang-sep {
        opacity: 0.3;
      }

      .lang-active {
        color: #ffffff;
        font-weight: 700;
      }

      .lang-muted {
        color: rgba(255, 255, 255, 0.42);
      }

      /* Fullscreen centered Buddy stage */
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        gap: clamp(42px, 6.5vh, 68px);
      }

      /* Subtle breathing halo behind Buddy eyes */
      .buddy-face {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(22px, 3.2vh, 34px);
      }

      .eyes-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(58px, 8.5vw, 118px);
        height: clamp(150px, 26vh, 260px);
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
      }

      .eye {
        position: relative;
        width: clamp(74px, 10.5vw, 136px);
        height: clamp(144px, 24vh, 252px);
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 0 64px rgba(255, 255, 255, 0.22);
        transform-origin: center center;
        transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1),
          height 0.14s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.25s ease;
        will-change: transform;
      }

      .eye::after {
        content: "";
        position: absolute;
        top: 14%;
        left: 22%;
        width: 22%;
        height: 22%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
        filter: blur(2px);
        opacity: 0.45;
      }

      .eyes-wrap.blinking .eye {
        transform: scaleY(0.06) scaleX(1.1);
      }

      .eyes-wrap.curious .eye {
        box-shadow: 0 0 84px rgba(255, 255, 255, 0.34);
      }

      .brand-name {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.48);
        text-transform: none;
      }

      /* 3 clean action buttons */
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        max-width: 680px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-width: 188px;
        height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: #ffffff;
        backdrop-filter: blur(12px);
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
          background 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .btn svg {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.13);
        border-color: rgba(255, 255, 255, 0.32);
        transform: translateY(-2px);
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn.primary {
        background: #ffffff;
        color: #000000;
        border-color: #ffffff;
        box-shadow: 0 8px 30px rgba(255, 255, 255, 0.16);
      }

      .btn.primary:hover {
        background: #f1f5f9;
        border-color: #f1f5f9;
        box-shadow: 0 12px 36px rgba(255, 255, 255, 0.24);
      }

      @media (max-width: 640px) {
        .stage {
          gap: 44px;
        }
        .eyes-wrap {
          gap: 54px;
          height: 158px;
        }
        .eye {
          width: 76px;
          height: 152px;
        }
        .actions {
          flex-direction: column;
          max-width: 280px;
        }
        .btn {
          width: 100%;
          height: 50px;
        }
      }
    </style>
  </head>
  <body>
    <button id="langToggle" class="lang-btn" type="button" aria-label="Switch Language">
      <span id="langZh" class="lang-active">中</span>
      <span class="lang-sep">/</span>
      <span id="langEn" class="lang-muted">EN</span>
    </button>

    <main class="stage">
      <div class="buddy-face">
        <div id="eyesWrap" class="eyes-wrap" aria-hidden="true">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="brand-name">Buddy</div>
      </div>

      <div class="actions">
        <a
          id="btnApk"
          class="btn primary"
          href="/downloads/BuddyMobile.apk"
          download="BuddyMobile.apk"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span data-i18n="apk">下载 Android APK</span>
        </a>

        <a id="btnWeb" class="btn" href="/app/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
            <line x1="12" y1="18" x2="12.01" y2="18" />
          </svg>
          <span data-i18n="web">在线手机端</span>
        </a>

        <a
          id="btnExe"
          class="btn"
          href="https://github.com/Marcus-dev00/Buddy/releases"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="12" y1="17" x2="12" y2="21" />
          </svg>
          <span data-i18n="exe">GitHub 下载 EXE</span>
        </a>
      </div>
    </main>

    <script>
      (function () {
        const COPY = {
          zh: {
            apk: "下载 Android APK",
            web: "在线手机端",
            exe: "GitHub 下载 EXE",
          },
          en: {
            apk: "Download Android APK",
            web: "Mobile Web App",
            exe: "Download EXE (GitHub)",
          },
        };

        let lang = "zh";
        try {
          const saved = localStorage.getItem("buddy_site_lang");
          if (saved === "zh" || saved === "en") {
            lang = saved;
          } else if (navigator.language && !navigator.language.toLowerCase().startsWith("zh")) {
            lang = "en";
          }
        } catch (_) {}

        const zhEl = document.getElementById("langZh");
        const enEl = document.getElementById("langEn");

        function applyLang(next) {
          lang = next;
          document.documentElement.lang = next === "zh" ? "zh-CN" : "en";
          document.querySelectorAll("[data-i18n]").forEach((el) => {
            const key = el.getAttribute("data-i18n");
            if (key && COPY[next][key]) el.textContent = COPY[next][key];
          });
          zhEl.className = next === "zh" ? "lang-active" : "lang-muted";
          enEl.className = next === "en" ? "lang-active" : "lang-muted";
          try {
            localStorage.setItem("buddy_site_lang", next);
          } catch (_) {}
        }

        applyLang(lang);
        document.getElementById("langToggle").addEventListener("click", () => {
          applyLang(lang === "zh" ? "en" : "zh");
        });

        // Living Buddy eyes: gentle cursor tracking + natural blinks
        const eyesWrap = document.getElementById("eyesWrap");
        let targetX = 0;
        let targetY = 0;
        let curX = 0;
        let curY = 0;

        window.addEventListener("pointermove", (e) => {
          const rect = eyesWrap.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = (e.clientX - cx) / Math.max(window.innerWidth * 0.45, 220);
          const dy = (e.clientY - cy) / Math.max(window.innerHeight * 0.45, 220);
          targetX = Math.max(-1, Math.min(1, dx)) * 28;
          targetY = Math.max(-1, Math.min(1, dy)) * 18;
        });

        window.addEventListener("pointerleave", () => {
          targetX = 0;
          targetY = 0;
        });

        document.querySelectorAll(".btn").forEach((b) => {
          b.addEventListener("pointerenter", () => eyesWrap.classList.add("curious"));
          b.addEventListener("pointerleave", () => eyesWrap.classList.remove("curious"));
        });

        function tick() {
          curX += (targetX - curX) * 0.12;
          curY += (targetY - curY) * 0.12;
          eyesWrap.style.transform = `translate3d(${curX.toFixed(2)}px, ${curY.toFixed(2)}px, 0)`;
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        function scheduleBlink() {
          const delay = 2600 + Math.random() * 3800;
          setTimeout(() => {
            eyesWrap.classList.add("blinking");
            setTimeout(() => {
              eyesWrap.classList.remove("blinking");
              if (Math.random() < 0.22) {
                setTimeout(() => {
                  eyesWrap.classList.add("blinking");
                  setTimeout(() => {
                    eyesWrap.classList.remove("blinking");
                    scheduleBlink();
                  }, 125);
                }, 140);
              } else {
                scheduleBlink();
              }
            }, 135);
          }, delay);
        }
        scheduleBlink();
      })();
    </script>
  </body>
</html>
