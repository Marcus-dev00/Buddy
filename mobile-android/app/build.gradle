plugins {
    id 'com.android.application'
}

android {
    namespace 'com.buddy.mobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.buddy.mobile"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "0.3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
